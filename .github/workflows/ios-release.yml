name: ICA Unified iOS Archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-release.yml', 'mobile/app.json', 'mobile/assets/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ica-unified-ios-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_PUBLIC_ICA_API_URL: https://unified.icomputeranything.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install and verify mobile app
        run: |
          npm ci --loglevel=error
          npm run typecheck
          npm run audit:security
      - name: Generate iPhone and iPad project
        run: |
          npx expo prebuild --platform ios
          xcodebuild -version
          xcodebuild -list -workspace ios/ICAUnified.xcworkspace
      - name: Compile unsigned App Store archive
        run: |
          xcodebuild -workspace ios/ICAUnified.xcworkspace -scheme ICAUnified -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ICAUnified.xcarchive" CURRENT_PROJECT_VERSION="${{ github.run_number }}" CODE_SIGNING_ALLOWED=NO archive
      - name: Preserve archive for signing
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ICAUnified.xcarchive" "$RUNNER_TEMP/ICAUnified-unsigned-archive.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ICA-Unified-unsigned-iOS-archive
          path: ${{ runner.temp }}/ICAUnified-unsigned-archive.zip
          retention-days: 14
