name: ICA Unified Mobile Check

on:
  # Pushes and pull requests already run mobile checks in ci.yml.
  workflow_dispatch:

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Install mobile dependencies
        run: npm ci

      - name: Audit mobile dependencies and verify security mitigation
        run: npm run audit:security

      - name: Type-check mobile app
        run: npm run typecheck
