name: ICA Unified Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-for-build-validation
      PLATFORM_AUTH_SECRET: ci-only-platform-secret-for-build-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high
      - name: Build Next.js app
        run: npm run build

      - name: Ensure Turnstile custom hostname
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SITE_KEY='0x4AAAAAAEpl_r2LJcL18Dn5'
          TARGET_HOST='unified.icomputeranything.com'

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials unavailable; Turnstile hostname update skipped."
            exit 0
          fi

          HTTP_CODE=$(curl -sS -o /tmp/turnstile-widget.json -w "%{http_code}"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets/$SITE_KEY"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Could not read Turnstile widget (HTTP $HTTP_CODE). The Cloudflare token may need Turnstile Sites Read/Edit permission."
            exit 0
          fi

          if ! jq -e '.success == true' /tmp/turnstile-widget.json >/dev/null; then
            echo "::warning::Cloudflare did not return a usable Turnstile widget response."
            exit 0
          fi

          DOMAINS=$(jq -c --arg host "$TARGET_HOST" '[(.result.domains // [])[]] + [$host] | unique' /tmp/turnstile-widget.json)
          jq -n --argjson domains "$DOMAINS" '{domains:$domains}' >/tmp/turnstile-update.json

          UPDATE_CODE=$(curl -sS -o /tmp/turnstile-update-response.json -w "%{http_code}"             -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets/$SITE_KEY"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/turnstile-update.json)

          if [ "$UPDATE_CODE" != "200" ] || ! jq -e '.success == true' /tmp/turnstile-update-response.json >/dev/null; then
            echo "::warning::Turnstile hostname update was not authorized (HTTP $UPDATE_CODE)."
            exit 0
          fi

          echo "Turnstile hostname confirmed: $TARGET_HOST"

      - name: Build and deploy ICA Unified to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deploy skipped: repository secrets are not configured yet."
            exit 0
          fi
          if ! npx wrangler d1 migrations apply ica-unified --remote; then
            echo "::warning::D1 migration command was not authorized by the current Cloudflare API token. ICA will use its idempotent runtime table bootstrap until D1 migration permission is added."
          fi
          npx opennextjs-cloudflare build
          npx wrangler deploy