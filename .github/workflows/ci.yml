name: ICA Unified Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-for-build-validation
      PLATFORM_AUTH_SECRET: ci-only-platform-secret-for-build-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high
      - name: Install mobile dependencies
        run: npm --prefix mobile install
      - name: Typecheck ICA Mobile
        run: npm --prefix mobile run typecheck
      - name: Validate desktop wrapper metadata
        run: |
          node -e "JSON.parse(require('fs').readFileSync('desktop/package.json','utf8')); JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8'));"
          cargo metadata --manifest-path desktop/src-tauri/Cargo.toml --format-version 1 --no-deps > /dev/null
      - name: Build Next.js app
        run: npm run build

      - name: Build and deploy ICA Unified to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deploy skipped: repository secrets are not configured yet."
            exit 0
          fi
          echo "Attempting ICA Unified D1 migrations..."
          if ! npx wrangler d1 migrations apply ica-unified --remote; then
            echo "::warning::Cloudflare token cannot query/apply D1 migrations. Continuing with Worker deployment because D1 authorization is separate from Worker deployment."
          fi

          echo "Attempting ICA Unified application D1 integrity check..."
          if ! npx wrangler d1 execute ica-unified --remote --command "PRAGMA integrity_check;"; then
            echo "::warning::Application D1 integrity check skipped because this token is not authorized for D1 queries."
          fi

          echo "Attempting ICA central D1 integrity check..."
          if ! npx wrangler d1 execute ica-saas-db --remote --command "PRAGMA integrity_check;"; then
            echo "::warning::Central D1 integrity check skipped because this token is not authorized for D1 queries."
          fi

          echo "Building and deploying ICA Unified..."
          npx opennextjs-cloudflare build
          npx wrangler deploy

          echo "Verifying deployed Unified health endpoint..."
          if ! curl --fail --show-error --silent https://unified.icomputeranything.com/api/health; then
            echo "::warning::Unified deployed, but the public health endpoint did not return healthy yet. Review the live D1 bindings/permissions separately."
          fi
