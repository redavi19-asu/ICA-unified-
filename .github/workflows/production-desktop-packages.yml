name: ICA Unified Production Desktop Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, windows, macos]
  push:
    branches: [main]
    paths:
      - "desktop/app-icon.svg"
      - ".github/workflows/production-desktop-packages.yml"

permissions:
  contents: write

concurrency:
  group: ica-unified-production-desktop
  cancel-in-progress: false

jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    outputs:
      windows_ready: ${{ steps.check.outputs.windows_ready }}
      apple_ready: ${{ steps.check.outputs.apple_ready }}
    steps:
      - id: check
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ]; then
            echo "windows_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure Artifact Signing requires AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and AZURE_TENANT_ID."
          fi
          apple_notary_ready=false
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            apple_notary_ready=true
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            apple_notary_ready=true
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ "$apple_notary_ready" = true ]; then
            echo "apple_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple Developer ID signing/notarization credentials are not configured yet."
          fi

  windows:
    needs: signing-preflight
    if: needs.signing-preflight.outputs.windows_ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform != 'macos')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Install Azure Artifact Signing CLI
        shell: pwsh
        run: |
          cargo install artifact-signing-cli --locked
          artifact-signing-cli --help | Out-Null
          Write-Host "Azure Artifact Signing CLI ready."

      - name: Configure Tauri to sign every Windows binary with Azure Artifact Signing
        shell: pwsh
        run: |
          $config = @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = "pwsh"
                  args = @("-NoProfile", "-File", (Join-Path $env:GITHUB_WORKSPACE "scripts\sign-windows.ps1"), "%1")
                }
              }
            }
          } | ConvertTo-Json -Depth 8
          Set-Content -Path "desktop\src-tauri\tauri.windows.conf.json" -Value $config
          Write-Host "Tauri Windows signing configured for ica-code-signing / ica-control-production."

      - name: Smoke-test Azure Artifact Signing access
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "ica-artifact-signing-probe.exe"
          Copy-Item "$env:SystemRoot\System32\where.exe" $probe -Force
          Write-Host "Testing Azure Artifact Signing access before the full Windows build..."
          & artifact-signing-cli -e "https://eus.codesigning.azure.net" -a "ica-code-signing" -c "ica-control-production" -d "ICA Unified Signing Probe" $probe 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            throw "Azure Artifact Signing probe failed. Review the error above for account/profile/RBAC details."
          }
          $signature = Get-AuthenticodeSignature $probe
          if ($signature.Status -ne "Valid") {
            throw "Azure Artifact Signing probe did not produce a valid Authenticode signature: $($signature.Status)"
          }
          Write-Host "Azure Artifact Signing probe succeeded with a valid Authenticode signature."

      - name: Build signed Windows installer
        working-directory: desktop
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify and publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "desktop\src-tauri\target\release\bundle" -Recurse -File -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows EXE installer was produced." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Windows signature is not valid: $($signature.Status)" }
          if ($env:GITHUB_REF -ne "refs/heads/main") { Write-Host "Branch signing validation passed; production release is reserved for main."; exit 0 }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $installer.FullName "release\ICA-Unified-Windows-x64.exe"
          gh release view unified-desktop-production --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create unified-desktop-production --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ICA Unified Production Desktop Apps" --notes "Verified signed production installers." }
          gh release upload unified-desktop-production "release\ICA-Unified-Windows-x64.exe" --repo "$env:GITHUB_REPOSITORY" --clobber

  macos:
    needs: signing-preflight
    if: needs.signing-preflight.outputs.apple_ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform != 'windows')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: ICA-Unified-macOS-Apple-Silicon.dmg
          - target: x86_64-apple-darwin
            asset: ICA-Unified-macOS-Intel.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.target }}
      - name: Prepare and validate Apple notarization credentials
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            umask 077
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            xcrun notarytool history --key "$key_path" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" >/dev/null
          else
            xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" >/dev/null
          fi
      - name: Build signed and notarized Mac package
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm ci --no-audit --no-fund
          # Tauri removes the app after dmg-only builds; retain it for verification.
          npm run build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Verify and publish Mac package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$(find "desktop/src-tauri/target/$TARGET/release/bundle" -type d -name '*.app' -print -quit)"
          DMG="$(find "desktop/src-tauri/target/$TARGET/release/bundle" -type f -name '*.dmg' -print -quit)"
          test -n "$APP" || { echo "::error::App bundle missing; use --bundles app,dmg."; exit 1; }
          test -n "$DMG" || { echo "::error::DMG missing."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$DMG"
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            notary_auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            notary_auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          xcrun notarytool submit "$DMG" "${notary_auth[@]}" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          mkdir -p release
          cp "$DMG" "release/$ASSET"
          gh release view unified-desktop-production --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            gh release create unified-desktop-production --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ICA Unified Production Desktop Apps" --notes "Verified signed production installers." ||
              gh release view unified-desktop-production --repo "$GITHUB_REPOSITORY" >/dev/null
          }
          gh release upload unified-desktop-production "release/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove temporary Apple API key
        if: always()
        shell: bash
        run: |
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then rm -f "$APPLE_API_KEY_PATH"; fi

  publish-download-urls:
    needs: [signing-preflight, windows, macos]
    if: always() && github.ref == 'refs/heads/main' && (needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Activate verified download URLs in ICA Unified
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/unified-desktop-production"
          if [ "${{ needs.windows.result }}" = "success" ]; then
            printf '%s' "$BASE/ICA-Unified-Windows-x64.exe" | npx --yes wrangler@4.147.0 secret put ICA_WINDOWS_DOWNLOAD_URL --name ica-unified
          fi
          if [ "${{ needs.macos.result }}" = "success" ]; then
            printf '%s' "$BASE/ICA-Unified-macOS-Apple-Silicon.dmg" | npx --yes wrangler@4.147.0 secret put ICA_MAC_DOWNLOAD_URL --name ica-unified
            printf '%s' "$BASE/ICA-Unified-macOS-Intel.dmg" | npx --yes wrangler@4.147.0 secret put ICA_MAC_INTEL_DOWNLOAD_URL --name ica-unified
          fi
