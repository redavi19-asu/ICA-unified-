name: Render approved ICA Unified brand icons
on:
  push:
    branches:
      - main
    paths:
      - "Daylight Global News LMS AMS Icon.png"
      - "scripts/render-approved-unified-icon.py"
      - ".github/workflows/build-unified-branding.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/render-approved-unified-icon.py
      - name: Commit updated branding assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ica-unified-icon.webp public/ica-unified-icon.svg public/ica-unified-icon.png
          git add mobile/assets/icon.png desktop/app-icon.png desktop/app-icon.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply approved daylight Unified icon across platform assets"
          git pull --rebase origin main
          git push origin HEAD:main
